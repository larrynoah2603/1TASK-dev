name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketing_test
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing -d ticketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ticketing:ticketing@localhost:5432/ticketing_test?schema=public
      RUN_DB_TESTS: "1"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-not-used-in-production
      CRON_SECRET: ci-only-cron-secret-not-used-in-production
      MICROSOFT_ENTRA_ID_CLIENT_ID: ci-client-id
      MICROSOFT_ENTRA_ID_CLIENT_SECRET: ci-client-secret
      MICROSOFT_ENTRA_ID_TENANT_ID: ci-tenant-id
      ALLOWED_EMAIL_DOMAIN: example.test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run complete validation
        run: npm run validate
